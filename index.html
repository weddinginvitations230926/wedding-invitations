     Адрес сайта (og:url и og:image) подставлен в расчёте на репозиторий temur-shirin —
     если назовёте его иначе, поправьте эти две строки. -->
<title>Temur &amp; Shirin — приглашение на свадьбу</title>
<meta name="description" content="22 октября 2026 года, Самарканд, Restoran Marjon. Пожалуйста, подтвердите присутствие.">

<meta property="og:title" content="Temur &amp; Shirin — приглашение на свадьбу">
<meta property="og:description" content="22 октября 2026, Самарканд, Restoran Marjon.">
<meta property="og:image" content="https://weddinginvitations230926.github.io/temur-shirin/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Tangerine:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Шаблон приглашения. Данные пары — в блоке WEDDING в конце файла. */
  :root{
    --bg1:#F4F6F0; --bg2:#E3E9D6;
    --gold:#9CAB74; --gold-soft:#C3D19E; --gold-deep:#6E7D4C;
    --blush:#C2A0A0;
    --ink:#3F4536; --ink-soft:#818C74;
    --glass:rgba(255,255,255,0.65); --glass-line:rgba(201,143,132,0.35);
    --surface:rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box;}
  /* высота считается от ширины, а не берётся из атрибута height */
  img{ max-width:100%; height:auto; }
  html{scroll-behavior:smooth;}
  html{ background:#F4F7EC; }
  body{
    margin:0; color:var(--ink); font-family:'Inter', sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    /* градиент тянется через всю страницу целиком, поэтому стыков секций не видно */
    background:linear-gradient(180deg,
      #FDFEFA 0%, #F7FAF0 14%, #EFF4E2 34%, #E9EFD9 52%, #EFF4E2 70%, #F7FAF0 86%, #FDFEFA 100%);
    background-repeat:no-repeat;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ---------- ЦВЕТНЫЕ СЕКЦИИ ---------- */
  .band.band-nopad{ padding-left:0; padding-right:0; }
  .band{
    position:relative; overflow:hidden;
    background:transparent;
    color:var(--ink);
    padding:86px 24px 78px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .band.hero-band{ min-height:100svh; justify-content:flex-start; padding-top:90px; }
  #band0{ padding-top:56px; }
  /* на невысоких экранах иллюстрация ещё компактнее, чтобы не доставать до даты */
  @media (max-height:700px){
    #band0{ padding-top:40px; }
    /* .band — чтобы правило было приоритетнее базового .hero-illustration ниже */
    .band .hero-illustration{ height:31vh; height:31svh; }
  }
  .hero-illustration{
    position:absolute; bottom:0; left:50%; transform:translateX(-46%);
    width:auto; height:41vh; height:41svh; max-height:372px; max-width:86%; object-fit:contain;
    opacity:.92; pointer-events:none; z-index:0;
  }
  /* мягкая подложка под текстом: даже если иллюстрация подойдёт вплотную, имена читаются */
  .hero-text{
    position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;
    padding:14px 18px 22px;
  }
  /* размытая подложка шире самого текста — её края уходят за пределы видимого,
     поэтому границы прямоугольника не видно, а имена читаются поверх иллюстрации */
  .hero-text::before{
    content:""; position:absolute; z-index:-1;
    left:-30%; right:-30%; top:-14%; bottom:-22%;
    background:radial-gradient(ellipse at 50% 46%,
      rgba(251,252,247,.95) 0%, rgba(251,252,247,.82) 34%, rgba(251,252,247,.35) 55%, rgba(251,252,247,0) 72%);
    pointer-events:none;
  }

  /* ---------- СЕКЦИЯ-ОБЛОЖКА: МОНОГРАММА С ЦВЕТАМИ ---------- */
  .cover-wrap{ position:relative; width:min(92vw,380px); height:min(92vw,420px); margin:0 auto; }
  .cover-ring{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:74%; aspect-ratio:1/1; border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.72);
    z-index:2;
  }
  .cover-ring::before{
    content:""; position:absolute; inset:9px; border:1px solid var(--gold-soft); border-radius:50%;
  }
  .cover-mono{
    font-family:'Playfair Display', serif; font-weight:600; font-style:normal;
    font-size:clamp(52px,15vw,72px); line-height:1.05; color:var(--gold-deep);
    letter-spacing:.01em; position:relative; z-index:1;
  }
  /* «Открыть»: касание запускает музыку — браузеры разрешают звук только после действия гостя */
  .open-btn{
    position:absolute; left:0; right:0; bottom:19%; margin:0 auto; width:max-content;
    z-index:2; padding:11px 26px; border-radius:999px; cursor:pointer;
    border:1px solid var(--gold); background:rgba(255,255,255,.9); color:var(--gold-deep);
    font-family:'Inter', sans-serif; font-size:13px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    box-shadow:0 10px 20px -14px rgba(90,105,60,.6);
    opacity:0; animation:fadeUp .9s ease 1.6s forwards, openPulse 2.8s ease-in-out 2.6s infinite;
    transition:background .2s ease, color .2s ease;
  }
  .open-btn[hidden]{ display:none; }
  .open-btn:hover{ background:var(--gold); color:#fff; }
  @keyframes openPulse{
    0%,100%{ box-shadow:0 10px 20px -14px rgba(90,105,60,.6), 0 0 0 0 rgba(156,171,116,.45); }
    60%{ box-shadow:0 10px 20px -14px rgba(90,105,60,.6), 0 0 0 11px rgba(156,171,116,0); }
  }
  .cover-mono .amp{
    display:inline-block; font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:400;
    font-size:.55em; color:#B98B3E; padding:0 .08em; vertical-align:middle;
  }
  .cover-flower{ position:absolute; pointer-events:none; z-index:3; opacity:0; animation:flowerFade 1.3s ease 1.3s forwards; }
  .cover-flower.f-top{ width:50%; top:-10%; left:50%; transform:translateX(-50%) rotate(-3deg); }
  .cover-flower.f-left{ width:52%; bottom:0%; left:-16%; transform:rotate(6deg); }
  .cover-flower.f-right{ width:48%; bottom:-4%; right:-16%; transform:scaleX(-1) rotate(-4deg); }
  .cover-sub{
    position:relative; z-index:5; max-width:300px;
    margin:34px auto 0; font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:19px; line-height:1.6; letter-spacing:.01em;
    color:var(--ink-soft); opacity:0; animation:fadeUp .9s ease .3s forwards;
  }
  .hero-quote{
    max-width:320px; margin:0 auto 18px; font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:19px; line-height:1.6; color:var(--ink-soft);
    opacity:0; animation:fadeUp .9s ease .1s forwards;
  }
  .band:not(.active-band) *{ animation-play-state:paused !important; }

  .band-sketch{ position:absolute; width:130px; height:150px; opacity:.5; pointer-events:none; color:var(--gold); }
  .band-sketch.tl{ top:18px; left:-14px; }
  .band-sketch.tr{ top:18px; right:-14px; transform:scaleX(-1); }
  .band-sketch.bl{ bottom:18px; left:-14px; transform:scaleY(-1); }
  .band-sketch.br{ bottom:18px; right:-14px; transform:scale(-1,-1); }
  .corner-flower{ position:absolute; top:0; width:52%; max-width:300px; z-index:4; pointer-events:none; opacity:0; animation:flowerFade 1.3s ease forwards; }
  .corner-flower-tl{ left:0; animation-delay:.25s; }
  .corner-flower-tr{ right:0; transform:scaleX(-1); animation-delay:.5s; }
  .corner-flower-bl{ top:auto; bottom:0; left:0; transform:scaleY(-1); animation-delay:.75s; }
  .corner-flower-br{ top:auto; bottom:0; right:0; transform:scale(-1,-1); animation-delay:1s; }
  @keyframes flowerFade{ from{ opacity:0; } to{ opacity:.97; } }

  /* ---------- FLOATING ORBS (общий лёгкий слой поверх всех секций) ---------- */
  /* z-index:2 — секции идут в потоке ниже по DOM и раньше полностью перекрывали этот слой */
  .orbs{ position:fixed; inset:0; overflow:hidden; z-index:2; pointer-events:none; }

  /* ---------- МУЗЫКА ---------- */
  .music-btn{
    position:fixed; top:14px; right:14px; z-index:7;
    width:46px; height:46px; padding:0; border-radius:50%; cursor:pointer;
    border:1px solid rgba(156,171,116,.5); background:rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    color:#6E7D4C; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px -12px rgba(90,105,60,.55);
    transition:transform .2s ease, background .2s ease;
  }
  .music-btn:hover{ transform:scale(1.06); background:rgba(255,255,255,.9); }
  .music-btn svg{ width:19px; height:19px; }
  .music-btn .icon-pause{ display:none; }
  .music-btn.playing .icon-play{ display:none; }
  .music-btn.playing .icon-pause{ display:block; }
  .music-btn.playing{ animation:musicPulse 2.6s ease-in-out infinite; }
  @keyframes musicPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(156,171,116,.45); }
    60%{ box-shadow:0 0 0 12px rgba(156,171,116,0); }
  }
  .orb{ position:absolute; border-radius:50%; filter:blur(24px); will-change:transform; }
  .o1{ width:200px; height:200px; left:-60px; top:8%; background:radial-gradient(circle, #E8C9A0, transparent 70%); opacity:.14; animation:float1 14s ease-in-out infinite; }
  .o2{ width:220px; height:220px; right:-80px; top:32%; background:radial-gradient(circle, #FFFFFF, transparent 70%); opacity:.22; animation:float2 17s ease-in-out infinite; }
  .o3{ width:160px; height:160px; left:10%; bottom:14%; background:radial-gradient(circle, #FFFFFF, transparent 70%); opacity:.18; animation:float3 13s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(30px,40px) scale(1.15); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-40px,-25px) scale(1.1); } }
  @keyframes float3{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(20px,-35px) scale(1.2); } }

  /* ---------- HERO / NAMES ---------- */
  .eyebrow{
    font-size:13.5px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-deep);
    font-weight:500; margin:0 0 26px; opacity:0; animation:fadeUp .9s ease .1s forwards;
  }
  /* для длинных подписей: разрядка меньше, иначе строка рвётся некрасиво */
  .eyebrow.long{ font-size:12.5px; letter-spacing:.14em; max-width:340px; line-height:2; margin-bottom:22px; }
  .names{ font-family:'Playfair Display', serif; font-weight:600; font-size:clamp(44px,12.5vw,64px); line-height:1.05; margin:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.25em; }
  .names .letter, .cover-mono .letter{
    display:inline-block; opacity:0; transform:translateY(34px) rotate(4deg);
    animation:letterIn .9s cubic-bezier(.2,.8,.2,1) forwards, foilShine 5.5s linear 1.2s infinite;
    background:linear-gradient(100deg, var(--gold-deep) 0%, var(--gold) 18%, #FBEAE6 32%, var(--gold-soft) 46%, var(--gold-deep) 64%, var(--gold) 80%, #FBEAE6 100%);
    background-size:280% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 26px rgba(201,143,132,.25);
  }
  @keyframes letterIn{ to{ opacity:1; transform:translateY(0) rotate(0); } }
  @keyframes foilShine{ from{ background-position:0% 0; } to{ background-position:280% 0; } }
  .amp{ font-style:italic; font-weight:400; color:var(--blush); opacity:0; animation:fadeUp .8s ease .9s forwards; padding:0 .05em; }
  .crest{ opacity:0; animation:fadeUp .9s ease 0s forwards; margin-bottom:18px; }
  .crest svg{ width:92px; height:92px; }
  .glow-line{ width:64px; height:1px; margin:22px auto 0; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0; animation:fadeUp .9s ease 1.1s forwards, shimmer 3.5s ease-in-out 2s infinite; }
  @keyframes shimmer{ 0%,100%{ opacity:.5; width:64px; } 50%{ opacity:1; width:96px; } }
  .place{ margin:18px 0 0; font-size:14.5px; letter-spacing:.1em; color:var(--ink-soft); opacity:0; animation:fadeUp .9s ease 1.25s forwards; text-transform:uppercase; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  .scroll-hint{ margin-top:34px; width:1px; height:40px; background:linear-gradient(var(--gold), transparent); opacity:.5; }

  /* ---------- GLASS CARD BASE ---------- */
  .glass{
    background:var(--glass); border:1px solid rgba(156,171,116,.22);
    border-radius:22px; box-shadow:0 22px 44px -28px rgba(90,105,60,.28);
    animation:breathe 6s ease-in-out infinite;
    position:relative;
  }
  .glass::before{
    content:""; position:absolute; inset:7px; border:1px solid rgba(156,171,116,.18); pointer-events:none; border-radius:16px;
  }
  @keyframes breathe{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  /* ---------- CALENDAR ---------- */
  .calendar-card{ width:100%; max-width:340px; margin:0 auto; padding:26px 22px 24px; }
  .cal-month{ font-family:'Cormorant Garamond', serif; font-style:italic; font-size:19px; color:var(--gold-deep); margin:0 0 16px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px 0; }
  .cal-dow{ font-size:10.5px; letter-spacing:.05em; color:var(--ink-soft); opacity:.7; padding-bottom:6px; }
  .cal-day{ position:relative; height:34px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink); }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.highlight{ color:#3A4230; font-weight:600; }
  /* круг фиксированного размера: ячейка шире, чем выше, и inset давал овал */
  .cal-day.highlight::after{
    content:""; position:absolute; left:50%; top:50%; width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(156,171,116,.5);
    animation:softHalo 3.4s ease-in-out infinite;
    z-index:0;
  }
  .cal-day.highlight::before{
    content:""; position:absolute; left:50%; top:50%; width:32px; height:32px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 32%, #FFFFFF 0%, var(--gold-soft) 62%, #B7C68F 100%);
    z-index:1;
  }
  @keyframes softHalo{
    0%,100%{ transform:translate(-50%,-50%) scale(1); opacity:.75; }
    50%{ transform:translate(-50%,-50%) scale(1.14); opacity:.3; }
  }
  .cal-day.highlight span{ position:relative; z-index:2; }
  @keyframes bezelSpin{ to{ transform:rotate(360deg); } }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(110,125,76,.30); }
    70%{ box-shadow:0 0 0 10px rgba(110,125,76,0); }
    100%{ box-shadow:0 0 0 0 rgba(110,125,76,0); }
  }
  .cal-caption{ margin:16px 0 0; font-size:12.5px; letter-spacing:.05em; color:var(--ink-soft); }

  /* ---------- COUNTDOWN ---------- */
  .countdown-card{ width:100%; max-width:360px; margin:28px auto 0; padding:26px 18px; }
  .cd-label{ margin:0 0 16px; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-soft); }
  .cd-grid{ display:flex; justify-content:center; gap:10px; }
  .cd-unit{ display:flex; flex-direction:column; align-items:center; width:64px; }
  .cd-box{ width:100%; padding:10px 0; border-radius:12px; background:var(--surface); border:1px solid var(--glass-line); }
  .cd-num{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:28px; line-height:1; color:var(--gold-deep); font-variant-numeric:tabular-nums; display:inline-block; }
  .cd-num.pulse{ animation:pop .4s ease; }
  @keyframes pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.28); } 100%{ transform:scale(1); } }
  .cd-unit-label{ margin-top:8px; font-size:10px; letter-spacing:.06em; color:var(--ink-soft); }

  /* ---------- RSVP ---------- */
  .rsvp-card{ width:100%; max-width:360px; margin:0 auto; padding:32px 24px; }
  .rsvp-title{ font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500; font-size:26px; margin:0 0 8px; color:var(--ink); }
  .rsvp-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 22px; line-height:1.6; }
  .rsvp-field{ text-align:left; margin-bottom:14px; }
  .rsvp-label{ display:block; font-size:12px; letter-spacing:.04em; color:var(--ink-soft); margin:0 0 7px; }
  .rsvp-input, .rsvp-note{
    width:100%; border:1px solid rgba(156,171,116,.28); background:rgba(255,255,255,.55);
    padding:14px 16px; font-family:'Inter', sans-serif; font-size:16px; color:var(--ink); border-radius:16px;
    display:block;
  }
  .rsvp-note{ resize:vertical; min-height:74px; line-height:1.5; }
  .rsvp-input::placeholder, .rsvp-note::placeholder{ color:var(--ink-soft); opacity:.7; }
  .rsvp-input:focus, .rsvp-note:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(156,171,116,.22); }
  .rsvp-input.invalid{ border-color:var(--blush); }
  .rsvp-toggle{ display:flex; gap:10px; margin-bottom:16px; }
  .rsvp-toggle button{
    flex:1; padding:14px 0; border-radius:16px; border:1px solid rgba(156,171,116,.28);
    background:rgba(255,255,255,.55); color:var(--ink); font-family:'Inter', sans-serif; font-size:15px;
    cursor:pointer; transition:background .2s ease, border-color .2s ease, color .2s ease;
  }
  .rsvp-toggle button.active[data-value="yes"]{ background:linear-gradient(135deg, #D2DEB4, #B3C291); color:#333B28; border-color:#B3C291; font-weight:500; }
  /* на тёмном фоне прежний тёмно-бордовый текст был нечитаем */
  .rsvp-toggle button.active[data-value="no"]{ background:rgba(194,160,160,.25); border-color:var(--blush); color:#8A4B4B; font-weight:500; }

  /* счётчик гостей */
  .rsvp-count{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    border:1px solid rgba(156,171,116,.28); background:rgba(255,255,255,.55); border-radius:16px; padding:9px 11px; }
  .rsvp-count button{
    width:38px; height:38px; flex:none; border-radius:10px; border:1px solid var(--glass-line);
    background:transparent; color:var(--ink); font-size:20px; line-height:1; cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .rsvp-count button:hover:not(:disabled){ border-color:var(--gold); }
  .rsvp-count button:disabled{ opacity:.35; cursor:default; }
  .rsvp-count-value{ font-family:'Cormorant Garamond', serif; font-size:20px; font-weight:600; color:var(--ink); }
  .rsvp-guests[hidden]{ display:none; }

  .rsvp-submit{
    display:block; width:100%; padding:16px 0; border:none; border-radius:16px; margin-top:6px;
    background:linear-gradient(135deg, #CBD8A8, #A9B983); color:#333B28;
    font-family:'Inter', sans-serif; font-size:15.5px; font-weight:500; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 10px 22px -14px rgba(110,125,76,.7);
    transition:filter .2s ease, box-shadow .2s ease;
  }
  .rsvp-submit:hover{ filter:brightness(1.04); box-shadow:0 14px 26px -14px rgba(110,125,76,.75); }
  .rsvp-submit:disabled, .rsvp-submit.busy{ opacity:.65; cursor:default; filter:none; }
  .rsvp-alts{ display:flex; gap:10px; }
  .rsvp-alt{
    display:block; flex:1; margin-top:10px; padding:14px 0; border-radius:16px; text-align:center;
    border:1px solid var(--glass-line); background:transparent; color:var(--ink-soft);
    font-family:'Inter', sans-serif; font-size:13.5px; cursor:pointer; text-decoration:none;
    transition:border-color .2s ease, color .2s ease;
  }
  .rsvp-alt:hover{ border-color:var(--gold); color:var(--ink); }
  .rsvp-hint{ margin:10px 0 0; font-size:12px; line-height:1.5; color:var(--ink-soft); opacity:.8; }
  .rsvp-error{ display:none; margin:12px 0 0; font-size:13px; color:var(--blush); }
  .rsvp-thanks{ display:none; margin:16px 0 0; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:17px; color:var(--gold-deep); line-height:1.5; }
  .rsvp-card.sent .rsvp-form{ display:none; }

  /* видимый фокус с клавиатуры по всей странице */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--gold); outline-offset:3px;
  }

  /* ---------- МЕСТО ---------- */
  .venue-card{ width:100%; max-width:360px; margin:0 auto; padding:30px 24px; }
  .venue-name{ font-family:'Playfair Display', serif; font-weight:600; font-size:25px; line-height:1.25; margin:0; color:var(--ink); }
  .venue-address{ margin:10px 0 0; font-size:14.5px; line-height:1.6; color:var(--ink-soft); }
  .venue-hint{ margin:8px 0 0; font-size:13px; color:var(--ink-soft); opacity:.85; }
  .venue-rule{ width:44px; height:1px; margin:20px auto; background:var(--gold-soft); opacity:.6; }
  .venue-plan{ margin:0; text-align:left; }
  .venue-plan div{ display:flex; gap:14px; align-items:baseline; padding:7px 0; }
  .venue-plan dt{ font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:600; color:var(--gold-deep); width:58px; flex:none; }
  .venue-plan dd{ margin:0; font-size:14px; color:var(--ink); }
  .venue-map{
    display:block; margin-top:22px; padding:14px 0; border-radius:12px;
    border:1px solid var(--gold); background:transparent; color:var(--gold-deep);
    font-family:'Inter', sans-serif; font-size:14px; letter-spacing:.06em; text-decoration:none;
    transition:background .2s ease, color .2s ease;
  }
  .venue-map:hover{ background:var(--gold); color:#F7F9F1; }
  .venue-map.secondary{ margin-top:10px; border-color:var(--glass-line); color:var(--ink-soft); }
  .venue-map.secondary:hover{ background:transparent; border-color:var(--gold); color:var(--gold-deep); }
  .venue-photo{
    margin:0 0 22px; border-radius:16px; overflow:hidden; border:1px solid var(--glass-line);
    box-shadow:0 18px 34px -22px rgba(0,0,0,.35); line-height:0;
  }
  .venue-photo img{ width:100%; height:auto; display:block; }

  /* ---------- SCROLL REVEAL ---------- */
  .reveal{ opacity:0; transform:translateY(18px); transition:opacity .9s ease, transform .9s ease; }
  .reveal.in-view{ opacity:1; transform:translateY(0); }

  /* ---------- ФОТОСЕССИЯ ---------- */
  .photo-page{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .photo-caption, .photo-page .eyebrow{ padding:0 24px; }
  /* Галерея во всю ширину экрана: выходим за боковые поля секции.
     100vw + отрицательный отступ — приём, который растягивает блок
     на весь экран, даже если родитель с padding. */
  .photo-full{
    width:100vw; max-width:100vw; margin-left:calc(50% - 50vw);
    display:flex; flex-direction:column; gap:10px;
  }
  .shot{
    position:relative; width:100%; overflow:hidden;
    background:linear-gradient(150deg, var(--bg1), var(--bg2));
  }
  .shot.portrait{ aspect-ratio:2/3; }
  .shot.landscape{ aspect-ratio:3/2; }
  .shot img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* на широких экранах кадр во всю ширину стал бы слишком высоким */
  @media (min-width:720px){
    .photo-full{ width:min(100vw, 560px); max-width:560px; margin-left:auto; margin-right:auto; }
    .shot{ border-radius:14px; }
  }
  .photo-caption{ margin:22px 0 0; font-family:'Cormorant Garamond', serif; font-style:italic; font-size:17px; color:var(--ink-soft); text-align:center; }

  footer{ margin-top:24px; font-size:11.5px; letter-spacing:.08em; color:var(--ink-soft); opacity:.8; }
</style>
</head>
<body>

  <!-- переиспользуемый эскиз веточки для углов секций -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="sketch" viewBox="0 0 130 150">

  <section class="band hero-band active-band" id="band-cover"

    <img class="corner-flower corner-flower-tl" alt="" src="img/corner-flower.webp" width="620" height="425">

  <section class="band hero-band" id="band0"
    style="--bg1:#FDFEFA; --bg2:#EFF3E4; --gold:#9CAB74; --gold-soft:#C3D19E; --gold-deep:#6E7D4C; --blush:#C2A0A0; --ink:#3F4536; --ink-soft:#818C74; --glass:rgba(255,255,255,0.72); --glass-line:rgba(156,171,116,0.35); --surface:rgba(0,0,0,0.03);">
    <svg class="band-sketch tl"><use href="#sketch"/></svg>

          <path d="M13 50c9-15 20-21 28-15M87 50c-9-15-20-21-28-15" stroke="#9CAB74" stroke-width="1" opacity=".8"/>
          <path d="M50 8 L53 15 L50 12 L47 15 Z" fill="#9CAB74" opacity=".8"/>

    <svg class="band-sketch tl"><use href="#sketch"/></svg>
    <svg class="band-sketch br"><use href="#sketch"/></svg>
    <section class="photo-page reveal photo-page-full">
      <p class="eyebrow long" id="photosTitle"></p>
      <div class="photo-full" id="gallery"></div>
    </section>
  </section>

  <!-- СЕКЦИЯ 3 — КАЛЕНДАРЬ + ТАЙМЕР (шампань) -->
  <section class="band" id="band2"
    style="--bg1:#FDFEFA; --bg2:#EFF3E4; --gold:#9CAB74; --gold-soft:#C3D19E; --gold-deep:#6E7D4C; --blush:#C2A0A0; --ink:#3F4536; --ink-soft:#818C74; --glass:rgba(255,255,255,0.72); --glass-line:rgba(156,171,116,0.35); --surface:rgba(0,0,0,0.03);">
    <svg class="band-sketch tr"><use href="#sketch"/></svg>
    <svg class="band-sketch bl"><use href="#sketch"/></svg>
    <p class="eyebrow">когда</p>
    <div class="glass calendar-card reveal">
      <p class="cal-month" id="calMonth"></p>
      <div class="cal-grid" id="calGrid">
        <span class="cal-dow">ПН</span><span class="cal-dow">ВТ</span><span class="cal-dow">СР</span>
        <span class="cal-dow">ЧТ</span><span class="cal-dow">ПТ</span><span class="cal-dow">СБ</span><span class="cal-dow">ВС</span>
      </div>
      <p class="cal-caption" id="calCaption"></p>

    <div class="glass countdown-card reveal">

        <div class="cd-unit"><div class="cd-box"><span class="cd-num" id="cd-days">00</span></div><span class="cd-unit-label">дней</span></div>

        <div class="cd-unit"><div class="cd-box"><span class="cd-num" id="cd-seconds">00</span></div><span class="cd-unit-label">секунд</span></div>

  <!-- СЕКЦИЯ 3.5 — МЕСТО -->
  <section class="band" id="band-venue"
    style="--bg1:#FDFEFA; --bg2:#EFF3E4; --gold:#9CAB74; --gold-soft:#C3D19E; --gold-deep:#6E7D4C; --blush:#C2A0A0; --ink:#3F4536; --ink-soft:#818C74; --glass:rgba(255,255,255,0.72); --glass-line:rgba(156,171,116,0.35); --surface:rgba(0,0,0,0.03);">
    <svg class="band-sketch tl"><use href="#sketch"/></svg>

    <div class="glass venue-card reveal">
      <figure class="venue-photo" id="venuePhoto">
        <img loading="lazy" decoding="async" id="venueImg" src="" width="1200" height="900" alt="">
      </figure>

      <dl class="venue-plan" id="venuePlan"></dl>

      <a class="venue-map" id="mapYandex" href="#" target="_blank" rel="noopener">Открыть в Яндекс Картах</a>
      <a class="venue-map secondary" id="mapGoogle" href="#" target="_blank" rel="noopener">Google Карты</a>

  <!-- СЕКЦИЯ 5 — RSVP (терракота) -->
  <section class="band" id="band4"
    style="--bg1:#FDFEFA; --bg2:#EFF3E4; --gold:#9CAB74; --gold-soft:#C3D19E; --gold-deep:#6E7D4C; --blush:#C2A0A0; --ink:#3F4536; --ink-soft:#818C74; --glass:rgba(255,255,255,0.72); --glass-line:rgba(156,171,116,0.35); --surface:rgba(0,0,0,0.03);">
    <svg class="band-sketch tr"><use href="#sketch"/></svg>
    <svg class="band-sketch bl"><use href="#sketch"/></svg>
    <p class="eyebrow">ваш ответ</p>
    <div class="glass rsvp-card reveal" id="rsvpCard">
      <h2 class="rsvp-title">Вы будете с нами?</h2>

      <div class="rsvp-form" id="rsvpForm">
        <div class="rsvp-field">
          <label class="rsvp-label" for="rsvpName">Ваше имя и фамилия</label>
          <input type="text" id="rsvpName" class="rsvp-input" autocomplete="name" placeholder="">
        </div>

        <div class="rsvp-toggle" id="rsvpToggle" role="group" aria-label="Придёте ли вы">
          <button type="button" class="active" data-value="yes" aria-pressed="true">Буду</button>
          <button type="button" data-value="no" aria-pressed="false">Не смогу</button>
        </div>

        <button type="button" class="rsvp-submit" id="rsvpSubmit">Отправить ответ</button>
        <p class="rsvp-hint" id="rsvpHint"></p>
        <p class="rsvp-error" id="rsvpError" role="alert"></p>
      </div>

      <p class="rsvp-thanks" id="rsvpThanks"></p>
    </div>
    <footer id="footerLine"></footer>
  </section>

<script>
  /* ╔══════════════════════════════════════════════════════════════╗
     ║   ДАННЫЕ ПАРЫ — для нового приглашения меняйте только здесь   ║
     ╚══════════════════════════════════════════════════════════════╝ */
  var WEDDING = {

    // ИМЕНА — так, как они будут написаны крупно на странице.
    // Первые буквы сами станут монограммой.
    groom: 'Temur',
    bride: 'Shirin',
    // Буквы монограммы. null — берутся первые буквы имён.
    // Нужны, если имя начинается с сочетания: ['T', 'Sh'], ['Ch', 'D'], ['Ж', 'Ш'].
    initials: ['T', 'Sh'],

    // ДАТА И ВРЕМЯ СБОРА ГОСТЕЙ — по местному времени.
    // Календарь, день недели и таймер посчитаются сами.
    date: '2026-10-22',          // ГГГГ-ММ-ДД
    time: '18:00',               // ЧЧ:ММ
    utcOffset: 5,                // часовой пояс: Узбекистан 5, Казахстан 5, Москва 3, Кыргызстан 6
    city: 'Самарканд',

    // ЦИТАТЫ. <br> — перенос строки.
    quoteCover: 'Среди тысяч дорог<br>наши сошлись в одну',
    quoteNames: 'Сердце знает, кого ждало —<br>и мы дождались друг друга',

    // ФОТОГРАФИИ — файлы кладутся в папку img.
    // portrait — вертикальное (2:3), landscape — горизонтальное (3:2).
    // Порядок в списке = порядок на странице. Пустой список [] — секция скроется.
    photosTitle: 'наша история в мгновениях',
    photos: [
      { file: 'photo-1.webp', type: 'landscape', alt: 'Temur и Shirin среди зелени' },
      { file: 'photo-2.webp', type: 'landscape', alt: 'Temur и Shirin в национальных нарядах' },
      { file: 'photo-3.webp', type: 'landscape', alt: 'Temur и Shirin на конной прогулке' },
      { file: 'photo-4.webp', type: 'portrait',  alt: 'Temur и Shirin в зале театра' }
    ],

    // МЕСТО
    venue: {
      name:    'Restoran «Marjon»',
      address: 'Самарканд',
      photo:   'venue.webp',     // файл в папке img (пропорции 4:3); '' — без фото зала
      mapQuery: '',              // что искать на карте; пусто — адрес + название
      coords: [39.581359, 66.967309],   // точная точка: [широта, долгота] — для Яндекс Карт
      googleQuery: 'HXJ8+JQQ, Самарканд, Samarqand Region, Узбекистан'   // Plus Code — для Google Карт
    },

    // РАСПИСАНИЕ ВЕЧЕРА — сколько угодно строк.
    schedule: [
      ['18:00', 'Сбор гостей'],
      ['18:30', 'Начало торжества'],
      ['23:00', 'Завершение вечера']
    ],

    // ОТВЕТЫ ГОСТЕЙ
    rsvp: 'telegram',            // 'telegram' — окно «Поделиться», 'whatsapp' — сразу в ваш чат
    whatsapp: '',                // для 'whatsapp': цифры с кодом страны, без + и пробелов

    // МУЗЫКА — файл рядом с index.html; '' — без музыки (кнопка скроется)
    music: 'music.mp3'
  };


  // ═══════════ ДАЛЬШЕ МЕНЯТЬ НИЧЕГО НЕ НУЖНО ═══════════

  // ---------- СБОРКА СТРАНИЦЫ ИЗ ДАННЫХ ----------
  var W = (function(cfg){
    var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var WEEKDAYS   = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

    var p = cfg.date.split('-').map(Number), y = p[0], m = p[1], day = p[2];
    var t = cfg.time.split(':').map(Number);
    var weekday = new Date(Date.UTC(y, m - 1, day)).getUTCDay();
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function $(id){ return document.getElementById(id); }

    var info = {
      start: new Date(Date.UTC(y, m - 1, day, t[0] - cfg.utcOffset, t[1])),
      dateLong: day + ' ' + MONTHS_GEN[m - 1],
      dateShort: pad(day) + '.' + pad(m) + '.' + y,
      couple: cfg.groom + ' & ' + cfg.bride
    };

    // монограмма и герб — первые буквы имён
    var a = (cfg.initials && cfg.initials[0]) || cfg.groom.charAt(0).toUpperCase();
    var b = (cfg.initials && cfg.initials[1]) || cfg.bride.charAt(0).toUpperCase();
    $('monoA').textContent = a; $('monoB').textContent = b;
    $('crestText').textContent = a + ' ' + b;

    $('quoteCover').innerHTML = cfg.quoteCover;
    $('quoteNames').innerHTML = cfg.quoteNames;
    $('placeLine').textContent = info.dateLong + ' ' + y + ' · ' + cfg.city;
    $('footerLine').textContent = info.couple + ' · ' + pad(day) + ' . ' + pad(m) + ' . ' + y;
    document.title = info.couple + ' — приглашение на свадьбу, ' + info.dateLong + ' ' + y;

    // фото
    if (!cfg.photos || !cfg.photos.length){
      $('band1').style.display = 'none';
    } else {
      $('photosTitle').textContent = cfg.photosTitle;
      cfg.photos.forEach(function(ph, i){
        var portrait = ph.type === 'portrait';
        var box = document.createElement('div');
        box.className = 'shot ' + (portrait ? 'portrait' : 'landscape');
        var img = document.createElement('img');
        img.src = 'img/' + ph.file;
        img.width = portrait ? 1067 : 1600;
        img.height = portrait ? 1600 : 1067;
        img.loading = i === 0 ? 'eager' : 'lazy';
        img.decoding = 'async';
        img.alt = ph.alt || ('Фото ' + (i + 1));
        box.appendChild(img);
        $('gallery').appendChild(box);
      });
    }

    // календарь: неделя начинается с понедельника
    $('calMonth').textContent = MONTHS_NOM[m - 1] + ' ' + y;
    var grid = $('calGrid');
    var lead = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
    var total = new Date(Date.UTC(y, m, 0)).getUTCDate();
    function cell(n){
      var s = document.createElement('span');
      s.className = 'cal-day' + (n === null ? ' empty' : (n === day ? ' highlight' : ''));
      if (n !== null){ var inner = document.createElement('span'); inner.textContent = n; s.appendChild(inner); }
      grid.appendChild(s);
    }
    for (var i = 0; i < lead; i++) cell(null);
    for (var n = 1; n <= total; n++) cell(n);
    for (var k = (lead + total) % 7; k !== 0 && k < 7; k++) cell(null);
    $('calCaption').textContent = WEEKDAYS[weekday] + ' · сбор гостей в ' + cfg.time;

    // место
    var v = cfg.venue;
    if (v.photo){ $('venueImg').src = 'img/' + v.photo; $('venueImg').alt = v.name; }
    else { $('venuePhoto').style.display = 'none'; }
    $('venueName').textContent = v.name;
    $('venueAddress').textContent = v.address;
    cfg.schedule.forEach(function(row){
      var wrap = document.createElement('div');
      var dt = document.createElement('dt'); dt.textContent = row[0];
      var dd = document.createElement('dd'); dd.textContent = row[1];
      wrap.appendChild(dt); wrap.appendChild(dd); $('venuePlan').appendChild(wrap);
    });
    var rawQuery = v.mapQuery || (v.address + ', ' + v.name);
    var hasCoords = v.coords && v.coords.length === 2;
    // Яндекс принимает точку в порядке «долгота,широта»
    $('mapYandex').href = hasCoords
      ? 'https://yandex.com/maps/?pt=' + v.coords[1] + ',' + v.coords[0] + '&z=17&l=map'
      : 'https://yandex.uz/maps/?text=' + encodeURIComponent(rawQuery);
    $('mapGoogle').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(
      v.googleQuery || (hasCoords ? v.coords[0] + ',' + v.coords[1] : rawQuery));

    // музыка
    if (cfg.music){ $('bgMusic').src = cfg.music; }
    else { $('musicBtn').style.display = 'none'; }

    return info;
  })(WEDDING);

  // ---------- ПАУЗА АНИМАЦИЙ ВНЕ ЭКРАНА + ПОЯВЛЕНИЕ КАРТОЧЕК ----------
  (function(){
    var bands = Array.prototype.slice.call(document.querySelectorAll('.band'));
    // сразу активируем первую секцию, чтобы буквы/цветы не ждали observer
    if (bands[0]) bands[0].classList.add('active-band');
    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          entry.target.classList.toggle('active-band', entry.isIntersecting);
          if (entry.isIntersecting){
            entry.target.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in-view'); });
          }
        });
      }, { threshold: 0.18 });
      bands.forEach(function(b){ io.observe(b); });
    } else {
      bands.forEach(function(b){
        b.classList.add('active-band');
        b.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in-view'); });
      });
    }
    // аварийная подстраховка: если через 2с что-то не активировалось — включаем всё
    setTimeout(function(){
      bands.forEach(function(b){ b.classList.add('active-band'); });
    }, 2000);
  })();

  // ---------- АНИМИРОВАННОЕ ПОЯВЛЕНИЕ ИМЁН ПО БУКВАМ ----------
  (function(){
    function renderLetters(el, text, startDelay){
      var frag = document.createDocumentFragment();
      text.split('').forEach(function(ch, i){
        var span = document.createElement('span');
        span.className = 'letter';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = (startDelay + i * 0.045) + 's';
        frag.appendChild(span);
      });
      el.appendChild(frag);
    }
    renderLetters(document.getElementById('name1'), WEDDING.groom, 0.15);
    renderLetters(document.getElementById('name2'), WEDDING.bride, 0.35 + WEDDING.groom.length * 0.045);
  })();

  // ---------- ТАЙМЕР ДО СВАДЬБЫ ----------
  (function(){
    var weddingDate = W.start;
    var els = {
      days: document.getElementById('cd-days'),
      hours: document.getElementById('cd-hours'),
      minutes: document.getElementById('cd-minutes'),
      seconds: document.getElementById('cd-seconds')
    };
    var label = document.querySelector('.cd-label');
    function pad(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
    var prev = {};
    var FORMS = {
      days:    ['день', 'дня', 'дней'],
      hours:   ['час', 'часа', 'часов'],
      minutes: ['минута', 'минуты', 'минут'],
      seconds: ['секунда', 'секунды', 'секунд']
    };
    function plural(n, f){
      var a = n % 10, b = n % 100;
      if (a === 1 && b !== 11) return f[0];
      if (a >= 2 && a <= 4 && (b < 11 || b > 14)) return f[1];
      return f[2];
    }
    var unitLabels = {};
    Object.keys(els).forEach(function(k){ unitLabels[k] = els[k].closest('.cd-unit').querySelector('.cd-unit-label'); });
    function tick(){
      var now = new Date();
      var diff = weddingDate.getTime() - now.getTime();
      if (diff <= 0){
        if (label) label.textContent = 'мы уже женаты!';
        els.days.textContent = els.hours.textContent = els.minutes.textContent = els.seconds.textContent = '00';
        clearInterval(timer);
        return;
      }
      var totalSeconds = Math.floor(diff / 1000);
      var vals = {
        days: Math.floor(totalSeconds / 86400),
        hours: Math.floor((totalSeconds % 86400) / 3600),
        minutes: Math.floor((totalSeconds % 3600) / 60),
        seconds: totalSeconds % 60
      };
      Object.keys(vals).forEach(function(key){
        var text = pad(vals[key]);
        if (prev[key] !== text){
          els[key].textContent = text;
          unitLabels[key].textContent = plural(vals[key], FORMS[key]);
          els[key].classList.remove('pulse');
          void els[key].offsetWidth;
          els[key].classList.add('pulse');
          prev[key] = text;
        }
      });
    }
    tick();
    var timer = setInterval(tick, 1000);
  })();

  // ---------- МУЗЫКА ----------
  (function(){
    var audio   = document.getElementById('bgMusic');
    var btn     = document.getElementById('musicBtn');
    var openBtn = document.getElementById('openBtn');
    if (!WEDDING.music) return;            // без музыки кнопки скрыты

    openBtn.hidden = false;
    var started = false;                   // гость уже взаимодействовал со страницей
    var wasPlaying = false;                // играла ли музыка, когда гость ушёл со страницы

    function fadeIn(){                     // плавное нарастание звука (на iPhone громкость системная — там без эффекта)
      var v = 0;
      audio.volume = 0;
      var t = setInterval(function(){
        v = Math.min(0.85, v + 0.05);
        audio.volume = v;
        if (v >= 0.85) clearInterval(t);
      }, 120);
    }
    function play(){
      return audio.play().then(function(){
        btn.classList.add('playing');
        btn.setAttribute('aria-label', 'Выключить музыку');
        fadeIn();
      }).catch(function(err){
        // файла нет или формат не поддерживается — кнопка с нотами не нужна
        if (err && err.name === 'NotSupportedError') btn.style.display = 'none';
      });
    }
    function pause(){
      audio.pause();
      btn.classList.remove('playing');
      btn.setAttribute('aria-label', 'Включить музыку');
    }

    // кнопка с нотами в углу: включить / выключить
    btn.addEventListener('click', function(){
      started = true;
      if (audio.paused) play(); else pause();
    });

    // «Открыть» на обложке: запускает музыку и перелистывает к именам
    openBtn.addEventListener('click', function(){
      started = true;
      if (audio.paused) play();
      var next = document.getElementById('band0');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (next) next.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    });

    // Если гость не нажал «Открыть», музыка включится при первом касании или нажатии клавиши.
    // Прокрутка звук не разблокирует ни в одном браузере, поэтому здесь только касания.
    // Чтобы музыка шла ТОЛЬКО по кнопкам — удалите этот блок.
    function firstGesture(){
      if (!started){ started = true; if (audio.paused) play(); }
      window.removeEventListener('click', firstGesture);
      window.removeEventListener('keydown', firstGesture);
    }
    window.addEventListener('click', firstGesture);
    window.addEventListener('keydown', firstGesture);

    // ушли в другое приложение — музыку на паузу, вернулись — продолжаем
    document.addEventListener('visibilitychange', function(){
      if (document.hidden){ wasPlaying = !audio.paused; if (wasPlaying) audio.pause(); }
      else if (wasPlaying){ wasPlaying = false; audio.play().catch(function(){}); }
    });
  })();

  // ---------- RSVP ----------
  (function(){
    var card    = document.getElementById('rsvpCard');
    var nameEl  = document.getElementById('rsvpName');
    var errorEl = document.getElementById('rsvpError');
    var thanksEl= document.getElementById('rsvpThanks');
    var buttons = document.querySelectorAll('#rsvpToggle button');
    document.getElementById('rsvpHint').textContent = WEDDING.rsvp === 'whatsapp'
      ? 'Откроется WhatsApp с готовым сообщением'
      : 'Откроется Telegram с готовым сообщением';

    var selected = 'yes';

    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        buttons.forEach(function(b){
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        selected = btn.dataset.value;
      });
    });

    function buildMessage(name){
      var lines = ['Ответ на приглашение — ' + W.couple + ', ' + W.dateShort, '', 'Имя: ' + name];
      lines.push(selected === 'yes' ? 'Придём: да' : 'Придём: к сожалению, нет');
      return lines.join('\n');
    }

    function showError(text){
      errorEl.textContent = text;
      errorEl.style.display = 'block';
    }

    function done(){
      thanksEl.textContent = selected === 'yes'
        ? 'Спасибо! Ждём вас ' + W.dateLong + ' 🤍'
        : 'Спасибо, что дали знать. Будем скучать 🤍';
      thanksEl.style.display = 'block';
      card.classList.add('sent');
    }

    // общая проверка перед отправкой в любой канал
    function validName(){
      var name = nameEl.value.trim();
      if (name.length < 2){
        nameEl.classList.add('invalid');
        showError('Напишите, пожалуйста, имя — иначе мы не поймём, от кого ответ.');
        nameEl.focus();
        return null;
      }
      nameEl.classList.remove('invalid');
      errorEl.style.display = 'none';
      return name;
    }

    // Открываем мессенджер с уже готовым сообщением.
    document.getElementById('rsvpSubmit').addEventListener('click', function(){
      var name = validName();
      if (!name) return;
      var text = encodeURIComponent(buildMessage(name));
      window.open(WEDDING.rsvp === 'whatsapp'
        ? 'https://wa.me/' + WEDDING.whatsapp + '?text=' + text
        : 'https://t.me/share/url?url=&text=' + text, '_blank', 'noopener');
      done();
    });
  })();
</script>
